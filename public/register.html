        <h1>Регистрация</h1>
        <input type="text" id="login" placeholder="Логин (мин 6 символов, латиница/цифры)">
        <input type="password" id="password" placeholder="Пароль (мин 8 символов)">
        <input type="text" id="full_name" placeholder="ФИО">
        <input type="text" id="phone" placeholder="Телефон 8(XXX)XXX-XX-XX">
        <input type="email" id="email" placeholder="Email">
        <button onclick="register()">Зарегистрироваться</button>
        <div id="message"></div>
        <div class="link">
            <a href="/login">Уже есть аккаунт? Войти</a>
        </div>
    </div>

    <script>
        async function register() {
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            const full_name = document.getElementById('full_name').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const messageDiv = document.getElementById('message');
            
            // Простая валидация
            if (login.length < 6) {
                messageDiv.className = 'error';
                messageDiv.innerText = 'Логин должен быть минимум 6 символов';
                return;
            }
            if (password.length < 8) {
                messageDiv.className = 'error';
                messageDiv.innerText = 'Пароль должен быть минимум 8 символов';
                return;
            }
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password, full_name, phone, email })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    messageDiv.className = 'success';
                    messageDiv.innerText = '✅ Регистрация успешна! Перенаправление...';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    messageDiv.className = 'error';
                    messageDiv.innerText = data.error || 'Ошибка регистрации';
                }
            } catch (err) {
                messageDiv.className = 'error';
                messageDiv.innerText = 'Ошибка соединения';
            }
        }
    </script>
