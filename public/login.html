        <h1>Вход</h1>
        <input type="text" id="login" placeholder="Логин" autocomplete="off">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()">Войти</button>
        <div id="error" class="error"></div>
        <div class="link">
            <a href="/register">Еще не зарегистрированы? Регистрация</a>
        </div>
    </div>

    <script>
        async function login() {
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            
            if (!login || !password) {
                errorDiv.innerText = 'Заполните все поля';
                return;
            }
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    if (data.isAdmin) {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/dashboard';
                    }
                } else {
                    errorDiv.innerText = data.error || 'Ошибка входа';
                }
            } catch (err) {
                errorDiv.innerText = 'Ошибка соединения';
            }
        }
        
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
