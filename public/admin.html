        <div class="header">
            <h1>Админ-панель</h1>
            <button class="btn btn-outline" onclick="logout()">Выйти</button>
        </div>

        <div class="card">
            <!-- НОВОЕ: Фильтры -->
            <div class="filters">
                <input type="text" id="filterUser" placeholder="🔍 Фильтр по пользователю">
                <select id="filterStatus">
                    <option value="">Все статусы</option>
                    <option value="Новая">Новая</option>
                    <option value="Идет обучение">Идет обучение</option>
                    <option value="Обучение завершено">Обучение завершено</option>
                </select>
                <button class="btn" onclick="applyFilters()">Применить</button>
                <button class="btn btn-danger" onclick="resetFilters()" style="background:#6c757d;">Сброс</button>
            </div>

            <div class="table-wrapper">
                <table id="applications-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Пользователь</th>
                            <th>Курс</th>
                            <th>Дата</th>
                            <th>Оплата</th>
                            <th>Статус</th>
                            <th>Отзыв</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody id="applications-list">
                        <tr><td colspan="8">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- НОВОЕ: Пагинация -->
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <script src="slider.js"></script>
    <script>
        let allApplications = [];
        let currentPage = 1;
        const itemsPerPage = 10;  // НОВОЕ: количество записей на странице

        async function checkAdmin() {
            const res = await fetch('/api/admin/applications');
            if (res.status === 403) {
                alert('⛔ Доступ запрещен. Только для администратора.');
                window.location.href = '/login';
            }
        }

        async function loadApplications() {
            try {
                const res = await fetch('/api/admin/applications');
                if (res.status === 403) {
                    window.location.href = '/login';
                    return;
                }
                allApplications = await res.json();
                applyFilters();
            } catch (err) {
                console.error(err);
            }
        }

        // НОВОЕ: Применение фильтров
        function applyFilters() {
            const filterUser = document.getElementById('filterUser').value.toLowerCase();
            const filterStatus = document.getElementById('filterStatus').value;

            let filtered = allApplications;
            if (filterUser) {
                filtered = filtered.filter(app => 
                    app.full_name.toLowerCase().includes(filterUser) || 
                    app.login.toLowerCase().includes(filterUser)
                );
            }
            if (filterStatus) {
                filtered = filtered.filter(app => app.status === filterStatus);
            }

            currentPage = 1;
            renderTable(filtered);
            renderPagination(filtered);
        }

        // НОВОЕ: Сброс фильтров
        function resetFilters() {
            document.getElementById('filterUser').value = '';
            document.getElementById('filterStatus').value = '';
            applyFilters();
        }

        // НОВОЕ: Отрисовка таблицы с пагинацией
        function renderTable(data) {
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = data.slice(start, end);

            const tbody = document.getElementById('applications-list');
            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8">📭 Нет заявок</td></tr>';
                return;
            }

            tbody.innerHTML = pageData.map(app => {
                let statusClass = '';
                if (app.status === 'Новая') statusClass = 'status-new';
                else if (app.status === 'Идет обучение') statusClass = 'status-learning';
                else if (app.status === 'Обучение завершено') statusClass = 'status-completed';

                const paymentText = app.payment_method === 'cash' ? '💰 Наличные' : '📱 Перевод';

                return `
                    <tr>
                        <td>${app.id}</td>
                        <td><strong>${escapeHtml(app.full_name)}</strong><br><small>@${escapeHtml(app.login)}</small></td>
                        <td>${escapeHtml(app.course_name)}</td>
                        <td>${app.start_date}</td>
                        <td>${paymentText}</td>
                        <td><span class="status ${statusClass}">${app.status}</span></td>
                        <td style="max-width:150px; word-break:break-word;">${escapeHtml(app.comment || '-')}</td>
                        <td>
                            <select id="status-${app.id}" class="status-select">
                                <option value="Новая" ${app.status === 'Новая' ? 'selected' : ''}>Новая</option>
                                <option value="Идет обучение" ${app.status === 'Идет обучение' ? 'selected' : ''}>Идет обучение</option>
                                <option value="Обучение завершено" ${app.status === 'Обучение завершено' ? 'selected' : ''}>Обучение завершено</option>
                            </select>
                            <button class="action-btn" onclick="updateStatus(${app.id})">💾 Сохранить</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // НОВОЕ: Отрисовка кнопок пагинации
        function renderPagination(data) {
            const totalPages = Math.ceil(data.length / itemsPerPage);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            pagination.innerHTML = html;
        }

        // НОВОЕ: Переход на страницу
        function goToPage(page) {
            currentPage = page;
            const filterUser = document.getElementById('filterUser').value.toLowerCase();
            const filterStatus = document.getElementById('filterStatus').value;

            let filtered = allApplications;
            if (filterUser) {
                filtered = filtered.filter(app => 
                    app.full_name.toLowerCase().includes(filterUser) || 
                    app.login.toLowerCase().includes(filterUser)
                );
            }
            if (filterStatus) {
                filtered = filtered.filter(app => app.status === filterStatus);
            }

            renderTable(filtered);
            renderPagination(filtered);
        }

        async function updateStatus(id) {
            const select = document.getElementById(`status-${id}`);
            const status = select.value;

            try {
                const res = await fetch(`/api/admin/applications/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });

                if (res.ok) {
                    alert('✅ Статус обновлен!');
                    loadApplications();
                } else {
                    alert('❌ Ошибка при обновлении');
                }
            } catch (err) {
                alert('❌ Ошибка соединения');
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        checkAdmin();
        loadApplications();
    </script>
