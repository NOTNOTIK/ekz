        <div class="header">
            <h1>Мои заявки</h1>
            <button class="btn-outline" onclick="logout()" style="padding: 8px 16px;">Выйти</button>
        </div>

        <a href="/new-application" class="btn btn-primary" style="display: block; text-decoration: none;">+ Новая заявка</a>

        <h2>История заявок</h2>
        <div id="applications"></div>
    </div>

    <script src="slider.js"></script>
    <script>
        async function loadApplications() {
            try {
                const res = await fetch('/api/my-applications');
                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                const apps = await res.json();

                const container = document.getElementById('applications');
                if (apps.length === 0) {
                    container.innerHTML = '<div class="empty">📭 У вас пока нет заявок</div>';
                    return;
                }

                container.innerHTML = apps.map(app => {
                    let statusClass = '';
                    if (app.status === 'Новая') statusClass = 'status-new';
                    else if (app.status === 'Идет обучение') statusClass = 'status-learning';
                    else if (app.status === 'Обучение завершено') statusClass = 'status-completed';

                    const paymentText = app.payment_method === 'cash' ? '💰 Наличными' : '📱 Перевод по номеру телефона';

                    // ============ КЛЮЧЕВОЙ МОМЕНТ ============
                    // Отзыв доступен ТОЛЬКО если статус "Обучение завершено"
                    const isCompleted = app.status === 'Обучение завершено';
                    
                    let reviewHtml = '';
                    if (isCompleted) {
                        reviewHtml = `
                            <div class="review-section">
                                <label>📝 Ваш отзыв о курсе:</label>
                                <textarea id="review-${app.id}" rows="3" placeholder="Поделитесь впечатлениями...">${escapeHtml(app.comment || '')}</textarea>
                                <button class="btn-save" onclick="saveReview(${app.id})">💾 Сохранить отзыв</button>
                            </div>
                        `;
                    } else {
                        reviewHtml = `
                            <div class="review-section">
                                <div class="review-locked">🔒 Отзыв можно оставить только после завершения обучения</div>
                            </div>
                        `;
                    }

                    return `
                        <div class="card">
                            <h3>📖 ${escapeHtml(app.course_name)}</h3>
                            <p>📅 Дата начала: ${app.start_date}</p>
                            <p>💳 Способ оплаты: ${paymentText}</p>
                            <p>🏷️ Статус: <span class="status ${statusClass}">${app.status}</span></p>
                            <p>🕐 Создано: ${new Date(app.created_at).toLocaleString()}</p>
                            ${reviewHtml}
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function saveReview(id) {
            const comment = document.getElementById(`review-${id}`).value;
            if (!comment.trim()) {
                alert('Пожалуйста, напишите отзыв');
                return;
            }
            
            try {
                const res = await fetch(`/api/applications/${id}/review`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ comment })
                });

                if (res.ok) {
                    alert('✅ Отзыв сохранен! Спасибо за обратную связь.');
                    loadApplications(); // Обновляем список
                } else {
                    alert('❌ Ошибка при сохранении отзыва');
                }
            } catch (err) {
                alert('❌ Ошибка соединения');
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        loadApplications();
    </script>
