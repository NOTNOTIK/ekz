        <div class="header">
            <h1>Новая заявка</h1>
            <button class="btn-outline" onclick="location.href='/dashboard'" style="background: rgba(255,255,255,0.2); padding: 8px 16px;">← Назад</button>
        </div>

        <div class="card">
            <div class="form-group">
                <label>📖 Название курса</label>
                <select id="course_name">
                    <option value="">Выберите курс</option>
                    <option value="Основы алгоритмизации и программирования">Основы алгоритмизации и программирования</option>
                    <option value="Основы веб-дизайна">Основы веб-дизайна</option>
                    <option value="Основы проектирования баз данных">Основы проектирования баз данных</option>
                </select>
                <div id="courseError" class="error"></div>
            </div>

            <div class="form-group">
                <label>📅 Желаемая дата начала</label>
                <input type="text" id="start_date" placeholder="ДД.ММ.ГГГГ" maxlength="10">
                <div id="dateError" class="error"></div>
            </div>

            <div class="form-group">
                <label>💳 Способ оплаты</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="payment" value="cash"> Наличными
                    </label>
                    <label>
                        <input type="radio" name="payment" value="transfer"> Перевод по номеру телефона
                    </label>
                </div>
                <div id="paymentError" class="error"></div>
            </div>

            <button class="btn" onclick="submitApplication()">Отправить заявку</button>
            <div id="message"></div>
        </div>
    </div>

    <script>
        // Маска для ввода даты ДД.ММ.ГГГГ
        document.getElementById('start_date').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) value = value.slice(0,2) + '.' + value.slice(2);
            if (value.length >= 5) value = value.slice(0,5) + '.' + value.slice(5,9);
            e.target.value = value.slice(0,10);
        });

        function validateDate(dateStr) {
            const regex = /^(\d{2})\.(\d{2})\.(\d{4})$/;
            if (!regex.test(dateStr)) return false;
            const day = parseInt(RegExp.$1);
            const month = parseInt(RegExp.$2);
            const year = parseInt(RegExp.$3);
            const date = new Date(year, month - 1, day);
            return date.getFullYear() === year && 
                   date.getMonth() === month - 1 && 
                   date.getDate() === day &&
                   date >= new Date();
        }

        async function submitApplication() {
            const course_name = document.getElementById('course_name').value;
            const start_date = document.getElementById('start_date').value;
            const paymentMethod = document.querySelector('input[name="payment"]:checked');
            const messageDiv = document.getElementById('message');

            document.getElementById('courseError').innerText = '';
            document.getElementById('dateError').innerText = '';
            document.getElementById('paymentError').innerText = '';

            let isValid = true;

            if (!course_name) {
                document.getElementById('courseError').innerText = 'Выберите курс';
                isValid = false;
            }
            if (!start_date) {
                document.getElementById('dateError').innerText = 'Введите дату';
                isValid = false;
            } else if (!validateDate(start_date)) {
                document.getElementById('dateError').innerText = 'Неверный формат (ДД.ММ.ГГГГ) или дата в прошлом';
                isValid = false;
            }
            if (!paymentMethod) {
                document.getElementById('paymentError').innerText = 'Выберите способ оплаты';
                isValid = false;
            }

            if (!isValid) return;

            try {
                const res = await fetch('/api/applications', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        course_name,
                        start_date,
                        payment_method: paymentMethod.value
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    messageDiv.className = 'success';
                    messageDiv.innerText = '✅ Заявка отправлена! Перенаправление...';
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    messageDiv.className = 'error';
                    messageDiv.innerText = data.error || 'Ошибка отправки';
                }
            } catch (err) {
                messageDiv.className = 'error';
                messageDiv.innerText = 'Ошибка соединения';
            }
        }
    </script>
